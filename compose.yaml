services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dominion
      POSTGRES_USER: dominion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominion -d dominion"]
      interval: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dominion:${POSTGRES_PASSWORD}@db:5432/dominion
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    profiles: ["development"]
volumes:
  pgdata:
